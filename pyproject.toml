[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8", "cython", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "acq4"
dynamic = ["version"]
# version = "0.9.3"
description = "Neurophysiology acquisition and analysis platform"
authors = [
    {name = "Luke Campagnola", email = "luke.campagnola@gmail.com"},
]
requires-python = "==3.13.7"
readme = "README.md"
license = "MIT"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Neuroscientists",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10+",
    "Topic :: Data Acquisition and Processing :: Neuroscience",
    "Topic :: Scientific Software :: Tools :: Python Modules",
]

dependencies = [
    "asteval==0.9.28",
    "certifi==2022.6.15",
    "chardet==3.0.4",
    "click",
    "coorx",
    # "cupy",
    "cycler==0.10.0",
    "h5py>=3.15.0",
    "idna==2.9",
    # "kiwisolver==1.1.0",
    "lmfit==1.2.2",
    "matplotlib>=3.10.7",
    "metaarray>=2.2.0",
    "mypy>=1.18.2",
    "neuroanalysis",
    "neuron>=8.2.3",
    "numba",
    "numpy>=1.25.1",
    "numpydoc>=1.1.0",
    "openpyxl==3.1.2",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "psutil>=7.1.3",
    "PyDAQmx",
    "pymmcore",
    "pyopengl",
    "pyparsing",
    "pyqt6==6.10.0",
    "pyqt6-sip==13.10",
    "pyqtgraph>=0.13.7",
    # "pyqtgraph @ git+https://github.com/acq4/pyqtgraph.git",
    "pyserial==3.4",
    "pytest",
    "python-dateutil==2.8.2",
    "pyyaml>=6.0.3",
    "requests==2.23.0",
    "sensapex",
    "scipy>=1.16.3",
    "Sphinx>=4.1.2",
    "six==1.17.0",
    "teleprox",
    "tifffile",
    "trimesh",
    "uncertainties==3.1.6",
    "urllib3>=1.25.8",
    "vispy",
]
[project.scripts]
acq4 = "acq4.__main__:main"

